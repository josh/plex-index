name: Publish

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Update index
        run: |
          go run . plex.parquet
        env:
          PLEX_INDEX_URL: ${{ vars.PLEX_INDEX_URL || 'https://josh.github.io/plex-index/plex.parquet' }}
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
          PLEX_SERVER_NAME: ${{ secrets.PLEX_SERVER_NAME }}
          IMDB_WATCHLIST_URL: ${{ vars.IMDB_WATCHLIST_URL }}
          DISCOVER_LIMIT: ${{ vars.DISCOVER_LIMIT }}
          REFRESH_LIMIT: ${{ vars.REFRESH_LIMIT }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plex
          path: plex.parquet
          retention-days: 7

  deploy:
    runs-on: ubuntu-slim
    needs: update

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download parquet artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: data/

      - name: Flatten directory structure
        run: |
          find data -name "*.parquet" -exec mv {} data/ \;
          find data -type d -empty -delete

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: data/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
